services:
  db:
    image: postgres:16
    container_name: practice_db
    environment:
      POSTGRES_DB: practice
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
    ports:
      - "54329:5432"
    volumes:
      - ./create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
      - ./insert_data.sql:/docker-entrypoint-initdb.d/02_insert_data.sql:ro
      - practice_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d practice"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  practice_pgdata:
